name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm install --no-audit --no-fund

      - name: "Step 1: Markdown → JSON"
        run: npm run md2json

      - name: "Step 2: Transformer adds linked data"
        run: npm run transform
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # To use an external transformer service instead, add a repository
          # variable TRANSFORMER_URL (Settings → Secrets and variables → Actions → Variables).
          TRANSFORMER_URL: ${{ vars.TRANSFORMER_URL }}

      - name: "Step 3: JSON → HTML"
        run: npm run render
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
